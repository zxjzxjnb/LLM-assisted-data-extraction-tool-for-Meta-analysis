# Copy to data/model_profiles.yaml (or point METAEXTRACT_MODEL_PROFILES at it).
# The default profile has no fallback; add fallbacks explicitly when desired.
active_profile: qwen

profiles:
  gemini:
    transport: gemini
    model: gemini-2.5-pro
    api_key_env: GOOGLE_API_KEY
    response_mode: auto
    fallbacks: []

  qwen:
    transport: openai_compatible
    endpoint: https://your-provider.example/v1
    model: your-model-id
    api_key_env: DASHSCOPE_API_KEY
    response_mode: json_schema
    fallbacks: []

  local:
    transport: openai_compatible
    endpoint: http://127.0.0.1:8000/v1
    model: local-model
    api_key_env: LOCAL_MODEL_API_KEY
    response_mode: json_object
    fallbacks: []

# Example of an explicit fallback chain:
#   fallbacks:
#     - profile: local
